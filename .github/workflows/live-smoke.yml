name: Live smoke (manual, network)

# This workflow is intentionally separate from deterministic CI.
# It performs real requests and must only be pointed at targets the operator
# is authorised to audit.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Authorised https:// target to audit'
        required: true
        type: string

permissions:
  contents: read

jobs:
  live-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Live audit
        env:
          LIVE_AUDIT_TARGET: ${{ inputs.target }}
        run: pnpm --filter @argus-audit/core test:live
